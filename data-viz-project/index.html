<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>Data Visualization Project</title>
  <meta name="description" content="Data visualizations about school shootings">
  <meta name="author" content="Logan Midler">

  <!-- Bootstrap CSS and JavaScript -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTZKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>

<body>

<div class="container">

  <div class="row mb-5">
    <div class="col-md-12">

      <iframe 
        title="Number of K-12 school shootings in the United States from 1966 to 2026, by state"
        aria-label="Choropleth map"
        id="datawrapper-chart-34rbT"
        src="https://datawrapper.dwcdn.net/34rbT/2/"
        scrolling="no"
        frameborder="0"
        style="width: 0; min-width: 100% !important; border: none;"
        height="510"
        data-external="1">
      </iframe>

      <script type="text/javascript">
        (function(){
          function e(){
            window.addEventListener(`message`,function(e){
              if(e.data[`datawrapper-height`]!==void 0){
                var t=document.querySelectorAll(`iframe`);
                for(var n in e.data[`datawrapper-height`])
                  for(var r=0,i;i=t[r];r++)
                    if(i.contentWindow===e.source){
                      var a=e.data[`datawrapper-height`][n]+`px`;
                      i.style.height=a}}})}e()})();
      </script>

    </div>
  </div>


  <div class="row mb-5">
    <div class="col-md-12">

      <iframe 
        title="K-12 School Shooting Incidents by School Level, since 2000."
        aria-label="Bar Chart"
        id="datawrapper-chart-6a8Se"
        src="https://datawrapper.dwcdn.net/6a8Se/1/"
        scrolling="no"
        frameborder="0"
        style="width: 0; min-width: 100% !important; border: none;"
        height="185"
        data-external="1">
      </iframe>
      <script type="text/javascript">
        (function(){
          function e(){
            window.addEventListener(`message`,function(e){
              if(e.data[`datawrapper-height`]!==void 0){
                var t=document.querySelectorAll(`iframe`);
                for(var n in e.data[`datawrapper-height`])
                  for(var r=0,i;i=t[r];r++)
                    if(i.contentWindow===e.source){
                      var a=e.data[`datawrapper-height`][n]+`px`;
                      i.style.height=a}}})}e()})();
      </script>

    </div>
  </div>


  
  <div class="row mb-5">
    <div class="col-md-12">

      <iframe 
        title="Students exposed to school shootings over time"
        aria-label="Column Chart"
        id="datawrapper-chart-zuNUC"
        src="https://datawrapper.dwcdn.net/zuNUC/2/"
        scrolling="no"
        frameborder="0"
        style="width: 0; min-width: 100% !important; border: none;"
        height="521"
        data-external="1">
      </iframe>
      <script type="text/javascript">
        (function(){
          function e(){
            window.addEventListener(`message`,function(e){
              if(e.data[`datawrapper-height`]!==void 0){
                var t=document.querySelectorAll(`iframe`);
                for(var n in e.data[`datawrapper-height`])
                  for(var r=0,i;i=t[r];r++)
                    if(i.contentWindow===e.source){
                      var a=e.data[`datawrapper-height`][n]+`px`;
                      i.style.height=a}}})}e()})();
        </script>

    </div>
  </div>

</div>

</body>
</html>
